name: Desktop (Windows)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["apps/desktop/**"]

permissions:
  contents: read

jobs:
  build:
    name: Tauri 2 Windows bundle
    runs-on: windows-latest
    env:
      # Remote HTTPS origin the desktop shell loads (repository variable, e.g. https://trading.example.com).
      TC_ORIGIN: ${{ vars.TC_ORIGIN }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - name: Require TC_ORIGIN
        shell: bash
        run: |
          if [[ -z "$TC_ORIGIN" ]]; then
            echo "::error::Set repository variable TC_ORIGIN (Settings > Secrets and variables > Actions > Variables)"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: npm ci --no-audit --no-fund
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: trading-center-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
