[package]
name = "tc-desktop"
version = "2.0.0"
description = "Trading Center Windows desktop shell (Tauri 2). Loads the remote HTTPS origin; no bundled UI, no IPC."
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

# Standalone workspace: not a member of the root backend workspace.
[workspace]

[lib]
name = "tc_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.4"
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
